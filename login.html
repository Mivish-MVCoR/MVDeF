<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVDeF — Вхід</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/theme.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-brand-wrap">
                <button class="auth-brand" id="demoLogo" type="button" aria-label="Логотип MVDeF">
                    <img src="assets/mvdef-mark.svg" alt="">
                    <span>MVDeF</span>
                </button>
                <div class="demo-toast" id="demoToast" role="status" aria-live="polite" hidden>
                    <p id="demoToastMessage"></p>
                </div>
            </div>
            <p>Введи команду <code>//empire</code> на сервері щоб отримати посилання для входу</p>
            <div id="status" class="status"></div>
        </div>
    </div>
    <script type="module">
        import { db } from './js/firebase.js';
        import { ref, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import './js/moderator-shortcut.js';

        let demoLogoClicks = 0;
        const demoToast = document.getElementById('demoToast');
        const demoToastMessage = document.getElementById('demoToastMessage');
        const demoMessages = {
            5: 'Ще 5 кліків до ДЕМО...',
            6: 'Ще 4 кліка до ДЕМО...',
            7: 'Ще 3 кліка до ДЕМО...',
            8: 'Ще 2 кліка до ДЕМО...',
            9: 'Ще 1 клік до ДЕМО...'
        };

        document.getElementById('demoLogo').addEventListener('click', () => {
            demoLogoClicks += 1;
            demoToast.hidden = true;
            if (demoLogoClicks === 10) {
                sessionStorage.setItem('uuid', 'demo-user');
                sessionStorage.setItem('playerName', 'Demo');
                sessionStorage.setItem('isDemo', 'true');
                window.location.href = 'cabinet.html';
                return;
            }

            const message = demoMessages[demoLogoClicks];
            if (message) {
                demoToastMessage.textContent = message;
                demoToast.hidden = false;
            }
        });

        demoToast.addEventListener('click', () => {
            demoToast.hidden = true;
        });

        document.addEventListener('click', event => {
            if (!demoToast.hidden &&
                !demoToast.contains(event.target) &&
                !document.getElementById('demoLogo').contains(event.target)) {
                demoToast.hidden = true;
            }
        });

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const status = document.getElementById('status');

        if (!token) {
            status.textContent = 'Токен не знайдено. Введи //empire на сервері.';
            status.className = 'status error';
        } else {
            status.textContent = 'Перевіряємо токен...';
            status.className = 'status info';

            const tokenRef = ref(db, `mvdef/tokens/${token}`);
            get(tokenRef).then(snapshot => {
                if (!snapshot.exists()) {
                    status.textContent = 'Токен недійсний або прострочений.';
                    status.className = 'status error';
                    return;
                }

                const data = snapshot.val();
                const now = Math.floor(Date.now() / 1000);

                if (data.expiresAt && data.expiresAt < now) {
                    status.textContent = 'Токен прострочений. Введи //empire ще раз.';
                    status.className = 'status error';
                    remove(tokenRef);
                    return;
                }

                sessionStorage.setItem('uuid', data.uuid);
                sessionStorage.setItem('playerName', data.playerName);
                remove(tokenRef);
                window.location.href = 'cabinet.html';
            }).catch(err => {
                status.textContent = 'Помилка підключення до бази даних.';
                status.className = 'status error';
            });
        }
    </script>
</body>
</html>
