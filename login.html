<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVDeF — Вхід</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/theme.js" defer></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-brand-wrap">
                <button class="auth-brand" id="demoLogo" type="button" aria-label="Логотип MVDeF">
                    <img src="assets/mvdef-mark.svg" alt="">
                    <span>MVDeF</span>
                </button>
                <div class="demo-toast" id="demoToast" role="status" aria-live="polite" hidden>
                    <p id="demoToastMessage"></p>
                </div>
            </div>
            <p>Введи команду <code>//empire</code> на сервері щоб отримати посилання для входу</p>
            <div id="status" class="status"></div>
        </div>
    </div>
    <script type="module">
        import { auth } from './js/firebase.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { CLOUDFLARE_API_URL, SITE_SESSION_KEY } from './js/cloudflare-config.js';
        import './js/moderator-shortcut.js';

        let demoLogoClicks = 0;
        const demoToast = document.getElementById('demoToast');
        const demoToastMessage = document.getElementById('demoToastMessage');
        const demoMessages = {
            5: 'Ще 5 кліків до ДЕМО...',
            6: 'Ще 4 кліка до ДЕМО...',
            7: 'Ще 3 кліка до ДЕМО...',
            8: 'Ще 2 кліка до ДЕМО...',
            9: 'Ще 1 клік до ДЕМО...'
        };

        document.getElementById('demoLogo').addEventListener('click', async () => {
            demoLogoClicks += 1;
            demoToast.hidden = true;
            if (demoLogoClicks === 10) {
                try {
                    await signOut(auth).catch(error => {
                        console.warn('Не вдалося завершити попередній Firebase-сеанс:', error);
                    });
                    sessionStorage.setItem('uuid', 'demo-user');
                    sessionStorage.setItem('playerName', 'Demo');
                    sessionStorage.setItem('isDemo', 'true');
                    sessionStorage.removeItem(SITE_SESSION_KEY);
                    window.location.href = 'cabinet.html';
                } catch (error) {
                    console.error('Не вдалося завершити попередній сеанс перед входом у демо:', error);
                    status.textContent = 'Не вдалося перейти в демо. Спробуй ще раз.';
                    status.className = 'status error';
                }
                return;
            }

            const message = demoMessages[demoLogoClicks];
            if (message) {
                demoToastMessage.textContent = message;
                demoToast.hidden = false;
            }
        });

        demoToast.addEventListener('click', () => {
            demoToast.hidden = true;
        });

        document.addEventListener('click', event => {
            if (!demoToast.hidden &&
                !demoToast.contains(event.target) &&
                !document.getElementById('demoLogo').contains(event.target)) {
                demoToast.hidden = true;
            }
        });

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const status = document.getElementById('status');

        if (!token) {
            status.textContent = 'Токен не знайдено. Введи //empire на сервері.';
            status.className = 'status error';
        } else {
            status.textContent = 'Перевіряємо токен...';
            status.className = 'status info';

            fetch(`${CLOUDFLARE_API_URL}/api/login/exchange`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ token })
            })
                .then(async response => {
                    const result = await response.json();
                    if (!response.ok) {
                        const error = new Error(result.error?.message || 'Помилка входу.');
                        error.code = result.error?.code;
                        throw error;
                    }
                    return result;
                })
                .then(async result => {
                    const { sessionToken, uuid, playerName, expiresAt } = result;
                    await signOut(auth).catch(error => {
                        console.warn('Не вдалося завершити попередній Firebase-сеанс:', error);
                    });
                    sessionStorage.setItem(SITE_SESSION_KEY, sessionToken);
                    sessionStorage.setItem('uuid', uuid);
                    sessionStorage.setItem('playerName', playerName);
                    sessionStorage.removeItem('isDemo');
                    sessionStorage.setItem('mvdefSessionExpiresAt', String(expiresAt));
                    window.history.replaceState({}, document.title, window.location.pathname);
                    window.location.href = 'cabinet.html';
                })
                .catch(error => {
                    console.error('Помилка безпечного входу:', error);
                    status.textContent = error.code === 'unauthenticated' ||
                        error.code === 'invalid-argument'
                        ? 'Токен недійсний, прострочений або вже використаний. Введи //empire на сервері ще раз.'
                        : 'Не вдалося підключитися для входу. Спробуй ще раз пізніше.';
                    status.className = 'status error';
                });
        }
    </script>
</body>
</html>
