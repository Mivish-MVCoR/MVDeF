<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVDeF — Кабінет</title>
    <script src="js/theme.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(10,14,23,0.95);
            border-bottom: 1px solid #1a2540;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 0.05em;
        }

        .navbar .logo span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 2px;
        }

        .navbar nav a {
            color: #8a9ab5;
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .navbar nav a:hover { color: #e0e0e0; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .greeting {
            margin-bottom: 32px;
        }

        .greeting h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e0e0e0;
        }

        .greeting p {
            color: #8a9ab5;
            margin-top: 4px;
            font-size: 0.9rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 12px;
            padding: 24px;
        }

        .card.full { grid-column: 1 / -1; }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4ade80;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .card .sub {
            color: #8a9ab5;
            font-size: 0.85rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a2540;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-label { color: #8a9ab5; font-size: 0.85rem; }
        .stat-value { color: #e0e0e0; font-size: 0.9rem; font-weight: 600; }

        .btn-map {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #4ade80;
            color: #0a0e17;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            margin-top: 16px;
            transition: opacity 0.2s;
        }

        .btn-map:hover { opacity: 0.85; }

        .notif-item {
            padding: 12px 0;
            border-bottom: 1px solid #1a2540;
            font-size: 0.88rem;
            color: #c0c0d0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .notif-item:last-child { border-bottom: none; }

        .notif-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-top: 5px;
            flex-shrink: 0;
        }

        .notif-dot.read { background: #1a2540; }

        .empty {
            color: #8a9ab5;
            font-size: 0.85rem;
            padding: 8px 0;
        }

        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #4ade80;
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.2);
            padding: 3px 10px;
            border-radius: 20px;
        }

        .status-online::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #4ade80;
            border-radius: 50%;
        }
    </style>
    <link rel="stylesheet" href="css/portal.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-area">
            <button class="logo" id="logoButton" type="button" aria-label="Логотип MVDeF">
                <img class="logo-mark" src="assets/mvdef-mark.svg" alt="">
                <span class="logo-word">MVDeF</span>
            </button>
            <div class="logo-easter-egg" id="logoEasterEgg" role="status" aria-live="polite" hidden>
                <p id="logoEasterEggMessage"></p>
            </div>
        </div>
        <nav>
            <a href="cabinet.html">Кабінет</a>
            <a href="map.html">Карта</a>
            <a href="roles.html" id="rolesLink" hidden>Ролі</a>
            <a href="empire-edit.html" id="editEmpireLink" hidden>Правління</a>
            <a href="#" id="logoutBtn">Вийти</a>
        </nav>
    </header>
    <main class="container">
        <div class="greeting">
            <h1 id="greetingName">Завантаження...</h1>
            <p>Панель керування Імперією</p>
        </div>

        <div class="grid">
            <div class="card" id="empireCard">
                <div class="card-label">Моя Імперія</div>
                <div id="empireContent"><div class="empty">Завантаження...</div></div>
                <a href="empire-create.html" class="btn-map" id="createEmpireLink" hidden>Створити правління →</a>
            </div>

            <div class="card">
                <div class="card-label">Статус</div>
                <div id="statusContent"><div class="empty">Завантаження...</div></div>
            </div>

            <section class="card">
                <div class="card-label">Відпочинок</div>
                <h2 class="section-title">Риболовля</h2>
                <p class="sub">Невдовзі тут можна буде вирушити на риболовлю.</p>
                <a class="btn-map" href="fishing.html">Відкрити риболовлю →</a>
            </section>

            <div class="card full">
                <div class="card-label">Сповіщення</div>
                <div id="notifications"><div class="empty">Завантаження...</div></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, auth } from './js/firebase.js';
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import './js/moderator-shortcut.js';

        const uuid = sessionStorage.getItem('uuid');
        const playerName = sessionStorage.getItem('playerName');

        if (!uuid) { window.location.href = 'login.html'; }

        document.getElementById('greetingName').textContent = `Вітаємо, ${playerName || 'Гравець'}`;

        let logoClicks = 0;
        const logoEasterEggMessages = {
            5: 'Ну що ти тут робиш, що ти хотів знайти',
            7: 'Ну що ти хочеш ?',
            9: 'Ще раз і кінець !'
        };
        const logoEasterEgg = document.getElementById('logoEasterEgg');
        const logoEasterEggMessage = document.getElementById('logoEasterEggMessage');

        const logoButton = document.getElementById('logoButton');

        logoButton.addEventListener('click', async () => {
            logoEasterEgg.hidden = true;
            logoClicks += 1;
            if (logoClicks === 10) {
                try {
                    await signOut(auth);
                    sessionStorage.clear();
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error('Не вдалося завершити сеанс Firebase:', error);
                    window.alert('Не вдалося безпечно завершити сеанс. Перевір підключення та спробуй ще раз.');
                }
                return;
            }

            const message = logoEasterEggMessages[logoClicks];
            if (message) {
                logoEasterEggMessage.textContent = message;
                logoEasterEgg.hidden = false;
            }
        });

        logoEasterEgg.addEventListener('click', () => {
            logoEasterEgg.hidden = true;
        });

        document.addEventListener('click', event => {
            if (!logoEasterEgg.hidden &&
                !logoButton.contains(event.target) &&
                !logoEasterEgg.contains(event.target)) {
                logoEasterEgg.hidden = true;
            }
        });

        // Завантажуємо імперію
        const empiresSnap = await get(ref(db, 'mvdef/empires'));
        let myEmpire = null;
        let myEmpireId = null;

        empiresSnap.forEach(child => {
            if (child.val().ownerUuid === uuid) {
                myEmpire = child.val();
                myEmpireId = child.key;
            }
        });

        const empireContent = document.getElementById('empireContent');
        const statusContent = document.getElementById('statusContent');

        if (myEmpire) {
            document.getElementById('rolesLink').hidden = false;
            document.getElementById('editEmpireLink').hidden = false;
            const chunksSnap = await get(ref(db, 'mvdef/chunks'));
            let chunkCount = 0;
            chunksSnap.forEach(child => {
                const c = child.val();
                if (c.empireId === myEmpireId && c.status === 'active') chunkCount++;
            });

            const empireHeading = document.createElement('h2');
            empireHeading.textContent = myEmpire.name || 'Без назви';
            const empireDetails = [];
            if (myEmpire.avatar?.startsWith('data:image/jpeg;base64,')) {
                const avatar = document.createElement('img');
                avatar.className = 'cabinet-empire-avatar';
                avatar.src = myEmpire.avatar;
                avatar.alt = `Аватар ${myEmpire.name}`;
                empireDetails.push(avatar);
            }
            if (myEmpire.description) {
                const description = document.createElement('p');
                description.className = 'sub';
                description.textContent = myEmpire.description;
                empireDetails.push(description);
            }
            const emperor = document.createElement('p');
            emperor.className = 'sub';
            emperor.textContent = `Імператор: ${myEmpire.ownerName || playerName || 'Гравець'}`;
            const mapLink = document.createElement('a');
            mapLink.href = 'map.html';
            mapLink.className = 'btn-map';
            mapLink.textContent = 'Відкрити карту →';
            empireContent.replaceChildren(...empireDetails, empireHeading, emperor, mapLink);

            statusContent.innerHTML = `
                <div class="stat-row">
                    <span class="stat-label">Статус</span>
                    <span class="status-online">NODE / ONLINE</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Чанків</span>
                    <span class="stat-value">${chunkCount}</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">ID Імперії</span>
                    <span class="stat-value">${myEmpireId}</span>
                </div>
            `;
        } else {
            const pendingEmpireRequest = await get(ref(db, `mvdef/empireRequests/${uuid}`));
            if (pendingEmpireRequest.exists()) {
                const request = pendingEmpireRequest.val();
                const organizationNames = {
                    empire: 'імперії', city: 'міста', village: 'села', country: 'країни'
                };
                const organizationName = organizationNames[request.organizationLevel] || 'правління';
                empireContent.replaceChildren();
                const pendingName = document.createElement('h2');
                pendingName.textContent = request.name || 'Нове правління';
                const pendingDescription = document.createElement('p');
                pendingDescription.className = 'sub';
                pendingDescription.textContent = `Заявка на створення ${organizationName} очікує на розгляд модератора.`;
                empireContent.append(pendingName, pendingDescription);
                statusContent.innerHTML = '<p class="status-pending">Очікує на розгляд модератора</p>';
            } else {
                empireContent.innerHTML = `
                    <p class="empty">У вас немає імперії.</p>
                    <p class="sub" style="margin-top:8px">Створи правління та дочекайся підтвердження модератора.</p>
                `;
                document.getElementById('createEmpireLink').hidden = false;
                statusContent.innerHTML = `<p class="empty">—</p>`;
            }
        }

        // Сповіщення
        const notifSnap = await get(ref(db, `mvdef/notifications/${uuid}`));
        const notifDiv = document.getElementById('notifications');

        if (!notifSnap.exists()) {
            notifDiv.innerHTML = '<div class="empty">Сповіщень немає.</div>';
        } else {
            let html = '';
            const updates = {};

            notifSnap.forEach(child => {
                const n = child.val();
                html += `
                    <div class="notif-item">
                        <div class="notif-dot ${n.read ? 'read' : ''}"></div>
                        <span>${n.message}</span>
                    </div>
                `;
                if (!n.read) {
                    updates[`mvdef/notifications/${uuid}/${child.key}/read`] = true;
                }
            });

            notifDiv.innerHTML = html;
            if (Object.keys(updates).length > 0) update(ref(db), updates);
        }
    </script>
    <script type="module" src="js/logout.js"></script>
</body>
</html>
