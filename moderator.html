<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVDeF — Модератор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(10,14,23,0.95);
            border-bottom: 1px solid #1a2540;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 0.05em;
        }

        .navbar .logo span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 2px;
        }

        .navbar .badge {
            font-size: 0.7rem;
            background: rgba(74,222,128,0.15);
            border: 1px solid rgba(74,222,128,0.3);
            color: #4ade80;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 12px;
            letter-spacing: 0.08em;
        }

        .navbar nav a {
            color: #8a9ab5;
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .navbar nav a:hover { color: #e0e0e0; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-title {
            margin-bottom: 32px;
        }

        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .page-title p {
            color: #8a9ab5;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Auth */
        .auth-box {
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            margin: 80px auto;
        }

        .auth-box h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .auth-box p {
            color: #8a9ab5;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: #1a1a1a;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-google:hover { opacity: 0.9; }

        .auth-status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #e94560;
            min-height: 20px;
        }

        /* Заявки */
        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4ade80;
            margin-bottom: 16px;
        }

        .empty {
            color: #8a9ab5;
            font-size: 0.85rem;
            padding: 20px 0;
        }

        .request-card {
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .request-info { flex: 1; }

        .request-empire {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .request-meta {
            font-size: 0.82rem;
            color: #8a9ab5;
        }

        .request-chunks {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4ade80;
            text-align: center;
            min-width: 60px;
        }

        .request-chunks span {
            display: block;
            font-size: 0.7rem;
            font-weight: 400;
            color: #8a9ab5;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .request-actions {
            display: flex;
            gap: 10px;
        }

        .btn-approve {
            background: rgba(74,222,128,0.15);
            border: 1px solid rgba(74,222,128,0.3);
            color: #4ade80;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-approve:hover { background: rgba(74,222,128,0.25); }

        .btn-reject {
            background: rgba(233,69,96,0.1);
            border: 1px solid rgba(233,69,96,0.3);
            color: #e94560;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reject:hover { background: rgba(233,69,96,0.2); }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.85rem;
            color: #4ade80;
            display: none;
            z-index: 100;
        }
    </style>
    <link rel="stylesheet" href="css/portal.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span></span> MVDeF
            <div class="badge">MODERATOR</div>
        </div>
        <nav>
            <a href="#" id="logoutBtn">Вийти</a>
        </nav>
    </header>

    <div id="authSection">
        <div class="auth-box">
            <h2>Панель модератора</h2>
            <p>Увійдіть через Google акаунт модератора</p>
            <button class="btn-google" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                    <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/>
                    <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/>
                    <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.31z"/>
                </svg>
                Увійти через Google
            </button>
            <div class="auth-status" id="authStatus"></div>
        </div>
    </div>

    <main id="modPanel" style="display:none">
        <div class="container">
            <div class="page-title">
                <h1>Заявки на території</h1>
                <p id="modEmail"></p>
            </div>
            <div class="section-label">Очікують підтвердження</div>
            <div id="pendingList"><div class="empty">Завантаження...</div></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { db, auth } from './js/firebase.js';
        import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const provider = new GoogleAuthProvider();

        function showToast(msg, color = '#4ade80') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.color = color;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => {
                document.getElementById('authStatus').textContent = 'Помилка: ' + err.message;
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async user => {
            if (!user) {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('modPanel').style.display = 'none';
                return;
            }

            const email = user.email.replace(/\./g, '_');
            const modSnap = await get(ref(db, `mvdef/moderators/${email}`));

            if (!modSnap.exists()) {
                document.getElementById('authStatus').textContent = 'Немає прав модератора.';
                signOut(auth);
                return;
            }

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('modPanel').style.display = 'block';
            document.getElementById('modEmail').textContent = user.email;
            loadPending();
        });

        async function loadPending() {
            const [chunksSnap, empiresSnap] = await Promise.all([
                get(ref(db, 'mvdef/chunks')),
                get(ref(db, 'mvdef/empires'))
            ]);

            const empires = {};
            empiresSnap.forEach(c => { empires[c.key] = c.val(); });

            const pendingByEmpire = {};
            chunksSnap.forEach(c => {
                const chunk = c.val();
                if (chunk.status !== 'pending') return;
                if (!pendingByEmpire[chunk.empireId]) pendingByEmpire[chunk.empireId] = [];
                pendingByEmpire[chunk.empireId].push(c.key);
            });

            const list = document.getElementById('pendingList');

            if (Object.keys(pendingByEmpire).length === 0) {
                list.innerHTML = '<div class="empty">Немає заявок на розгляді.</div>';
                return;
            }

            list.innerHTML = Object.entries(pendingByEmpire).map(([empireId, keys]) => {
                const e = empires[empireId];
                if (!e) return '';
                return `
                    <div class="request-card">
                        <div class="request-info">
                            <div class="request-empire">⚑ ${e.name}</div>
                            <div class="request-meta">Гравець: ${e.ownerName}</div>
                        </div>
                        <div class="request-chunks">
                            ${keys.length}
                            <span>чанків</span>
                        </div>
                        <div class="request-actions">
                            <button class="btn-approve" onclick="approve('${empireId}','${e.ownerUuid}',${JSON.stringify(keys)})">✓ Підтвердити</button>
                            <button class="btn-reject" onclick="reject('${empireId}','${e.ownerUuid}',${JSON.stringify(keys)})">✗ Відхилити</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.approve = async (empireId, ownerUuid, keys) => {
            const updates = {};
            keys.forEach(k => { updates[`mvdef/chunks/${k}/status`] = 'active'; });
            updates[`mvdef/notifications/${ownerUuid}/${Date.now()}`] = {
                message: `✅ Заявку підтверджено! Імперія розширена на ${keys.length} чанків.`,
                read: false,
                createdAt: Date.now()
            };
            await update(ref(db), updates);
            showToast('✓ Підтверджено!');
            loadPending();
        };

        window.reject = async (empireId, ownerUuid, keys) => {
            const updates = {};
            keys.forEach(k => {
                updates[`mvdef/chunks/${k}/status`] = 'neutral';
                updates[`mvdef/chunks/${k}/empireId`] = null;
            });
            updates[`mvdef/notifications/${ownerUuid}/${Date.now()}`] = {
                message: `❌ Заявку відхилено. Зверніться до адміністратора.`,
                read: false,
                createdAt: Date.now()
            };
            await update(ref(db), updates);
            showToast('Відхилено.', '#e94560');
            loadPending();
        };
    </script>
</body>
</html>
