<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVDeF — Модератор</title>
    <script src="js/theme.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(10,14,23,0.95);
            border-bottom: 1px solid #1a2540;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 0.05em;
        }

        .navbar .logo span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 2px;
        }

        .navbar .badge {
            font-size: 0.7rem;
            background: rgba(74,222,128,0.15);
            border: 1px solid rgba(74,222,128,0.3);
            color: #4ade80;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 12px;
            letter-spacing: 0.08em;
        }

        .navbar nav a {
            color: #8a9ab5;
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .navbar nav a:hover { color: #e0e0e0; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .page-title {
            margin-bottom: 32px;
        }

        .page-title h1 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .page-title p {
            color: #8a9ab5;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Auth */
        .auth-box {
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            margin: 80px auto;
        }

        .auth-box h2 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .auth-box p {
            color: #8a9ab5;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .btn-google {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: #1a1a1a;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-google:hover { opacity: 0.9; }

        .auth-status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #e94560;
            min-height: 20px;
        }

        /* Заявки */
        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4ade80;
            margin-bottom: 16px;
        }

        .empty {
            color: #8a9ab5;
            font-size: 0.85rem;
            padding: 20px 0;
        }

        .request-card {
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .request-info { flex: 1; }

        .request-empire {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .request-meta {
            font-size: 0.82rem;
            color: #8a9ab5;
        }

        .request-chunks {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4ade80;
            text-align: center;
            min-width: 60px;
        }

        .request-chunks span {
            display: block;
            font-size: 0.7rem;
            font-weight: 400;
            color: #8a9ab5;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .request-actions {
            display: flex;
            gap: 10px;
        }

        .btn-approve {
            background: rgba(74,222,128,0.15);
            border: 1px solid rgba(74,222,128,0.3);
            color: #4ade80;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-approve:hover { background: rgba(74,222,128,0.25); }

        .btn-reject {
            background: rgba(233,69,96,0.1);
            border: 1px solid rgba(233,69,96,0.3);
            color: #e94560;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reject:hover { background: rgba(233,69,96,0.2); }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0d1220;
            border: 1px solid #1a2540;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 0.85rem;
            color: #4ade80;
            display: none;
            z-index: 100;
        }
    </style>
    <link rel="stylesheet" href="css/portal.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-group">
            <div class="logo">
                <img class="logo-mark" src="assets/mvdef-mark.svg" alt="">
                <span class="logo-word">MVDeF</span>
            </div>
            <div class="badge">MODERATOR</div>
        </div>
        <nav>
            <a href="cabinet.html" class="system-mode-link">В систему</a>
            <a href="#" id="logoutBtn">Вихід</a>
        </nav>
    </header>

    <div id="authSection">
        <div class="auth-box">
            <h2>Панель модератора</h2>
            <p>Увійдіть через Google акаунт модератора</p>
            <button class="btn-google" id="googleLoginBtn">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                    <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/>
                    <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/>
                    <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.31z"/>
                </svg>
                Увійти через Google
            </button>
            <div class="auth-status" id="authStatus"></div>
        </div>
    </div>

    <main id="modPanel" style="display:none">
        <div class="container">
            <div class="page-title">
                <h1>Заявки на модерацію</h1>
                <p id="modEmail"></p>
            </div>
            <div class="section-label">Очікують підтвердження</div>
            <div id="pendingList"><div class="empty">Завантаження...</div></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>
    <div class="request-minimap" id="requestMinimap" aria-hidden="true">
        <div class="request-minimap-title" id="requestMinimapTitle"></div>
        <canvas id="requestMinimapCanvas"></canvas>
        <div class="request-minimap-caption">Вибрані чанки та сусідня територія</div>
    </div>

    <script type="module">
        import { db, auth } from './js/firebase.js';
        import { GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, get, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const provider = new GoogleAuthProvider();
        const pendingRequestsById = new Map();
        const requestMinimap = document.getElementById('requestMinimap');
        const requestMinimapCanvas = document.getElementById('requestMinimapCanvas');
        const requestMinimapTitle = document.getElementById('requestMinimapTitle');
        let hoveredRequestCard = null;
        let shiftPressed = false;
        let pointerX = 0;
        let pointerY = 0;
        let minimapChunks = {};
        let minimapEmpires = {};
        let minimapBiomes = {};

        function showToast(msg, color = '#a7d99a') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.color = color;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(err => {
                document.getElementById('authStatus').textContent = 'Помилка: ' + err.message;
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        document.addEventListener('keydown', event => {
            if (event.key !== 'Shift') return;
            shiftPressed = true;
            updateRequestMinimap();
        });

        document.addEventListener('keyup', event => {
            if (event.key !== 'Shift') return;
            shiftPressed = false;
            hideRequestMinimap();
        });

        window.addEventListener('blur', () => {
            shiftPressed = false;
            hideRequestMinimap();
        });

        document.addEventListener('pointermove', event => {
            pointerX = event.clientX;
            pointerY = event.clientY;
            if (requestMinimap.style.display === 'block') {
                positionRequestMinimap(pointerX, pointerY);
            }
        });

        document.getElementById('pendingList').addEventListener('pointerover', event => {
            const card = event.target.closest('.request-card');
            if (!card || card.contains(event.relatedTarget)) return;
            pointerX = event.clientX;
            pointerY = event.clientY;
            hoveredRequestCard = card;
            updateRequestMinimap();
        });

        document.getElementById('pendingList').addEventListener('pointerout', event => {
            const card = event.target.closest('.request-card');
            if (!card || card.contains(event.relatedTarget)) return;
            if (hoveredRequestCard === card && !shiftPressed) {
                hoveredRequestCard = null;
                hideRequestMinimap();
            }
        });

        document.getElementById('pendingList').addEventListener('click', async event => {
            const button = event.target.closest('button[data-action][data-request-id]');
            if (!button) return;

            const request = pendingRequestsById.get(button.dataset.requestId);
            if (!request || button.disabled) return;

            button.disabled = true;
            const requestActionButtons = button.closest('.request-actions').querySelectorAll('button');
            requestActionButtons.forEach(actionButton => { actionButton.disabled = true; });
            if (button.dataset.action === 'approve') {
                const succeeded = request.actionType === 'creation'
                    ? await approveCreationRequest(request)
                    : await approveRequest(request);
                if (!succeeded) {
                    requestActionButtons.forEach(actionButton => { actionButton.disabled = false; });
                }
            } else if (button.dataset.action === 'reject') {
                const succeeded = request.actionType === 'creation'
                    ? await rejectCreationRequest(request)
                    : await rejectRequest(request);
                if (!succeeded) {
                    requestActionButtons.forEach(actionButton => { actionButton.disabled = false; });
                }
            }
        });

        onAuthStateChanged(auth, async user => {
            if (!user) {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('modPanel').style.display = 'none';
                return;
            }

            const email = user.email.replace(/\./g, '_');
            const modSnap = await get(ref(db, `mvdef/moderators/${email}`));

            if (!modSnap.exists()) {
                document.getElementById('authStatus').textContent = 'Немає прав модератора.';
                signOut(auth);
                return;
            }

            document.getElementById('authSection').style.display = 'none';
            document.getElementById('modPanel').style.display = 'block';
            document.getElementById('modEmail').textContent = user.email;
            loadPending().catch(error => {
                console.error('Не вдалося завантажити заявки модерації:', error);
                document.getElementById('pendingList').textContent = 'Не вдалося завантажити заявки модерації.';
                showToast(`Помилка завантаження заявок: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
            });
        });

        async function loadPending() {
            const [chunksSnap, empiresSnap, empireRequestsSnap] = await Promise.all([
                get(ref(db, 'mvdef/chunks')),
                get(ref(db, 'mvdef/empires')),
                get(ref(db, 'mvdef/empireRequests'))
            ]);

            minimapChunks = {};
            chunksSnap.forEach(c => { minimapChunks[c.key] = c.val(); });
            const empires = {};
            let empireColorIndex = 0;
            const minimapPalette = ['#d88076', '#7aa6d6', '#d2bd70', '#ad8ad1', '#67baa9', '#c77eae', '#91aa75'];
            empiresSnap.forEach(c => {
                empires[c.key] = c.val();
                minimapEmpires[c.key] = minimapPalette[empireColorIndex % minimapPalette.length];
                empireColorIndex++;
            });
            minimapBiomes = {};
            const biomesSnap = await get(ref(db, 'mvdef/map'));
            biomesSnap.forEach(c => {
                minimapBiomes[c.key] = c.val().color || '#24312a';
            });

            const pendingByEmpire = {};
            chunksSnap.forEach(c => {
                const chunk = c.val();
                if (chunk.status !== 'pending') return;
                const requestType = chunk.requestType === 'surrender' ? 'surrender' : 'claim';
                const groupKey = `${chunk.empireId}:${requestType}`;
                if (!pendingByEmpire[groupKey]) {
                    pendingByEmpire[groupKey] = {
                        empireId: chunk.empireId,
                        requestType,
                        keys: []
                    };
                }
                pendingByEmpire[groupKey].keys.push(c.key);
            });

            const list = document.getElementById('pendingList');
            pendingRequestsById.clear();
            let requestIndex = 0;

            const requestCards = Object.values(pendingByEmpire).map(({ empireId, requestType, keys }) => {
                const empire = empires[empireId];
                if (!empire) return '';
                const requestId = `request-${requestIndex++}`;
                pendingRequestsById.set(requestId, {
                    actionType: 'territory',
                    empireId,
                    ownerUuid: empire.ownerUuid,
                    keys,
                    requestType,
                    empireName: empire.name
                }).filter(Boolean);
                return `
                    <div class="request-card" data-request-id="${requestId}">
                        <div class="request-info">
                            <div class="request-empire">⚑ ${escapeHtml(empire.name)}</div>
                            <div class="request-meta">Гравець: ${escapeHtml(empire.ownerName)}</div>
                            <div class="request-type">${requestType === 'surrender' ? 'Відмова від території' : 'Розширення території'}</div>
                        </div>
                        <div class="request-chunks">
                            ${keys.length}
                            <span>чанків</span>
                        </div>
                        <div class="request-actions">
                            <button class="btn-approve" type="button" data-action="approve" data-request-id="${requestId}">✓ Підтвердити</button>
                            <button class="btn-reject" type="button" data-action="reject" data-request-id="${requestId}">✗ Відхилити</button>
                        </div>
                    </div>
                `;
            });

            const organizationLabels = {
                empire: 'Імперія', city: 'Місто', village: 'Село', country: 'Країна'
            };
            empireRequestsSnap.forEach(child => {
                const request = child.val();
                if (!request || typeof request !== 'object') return;
                const requestId = `creation-${requestIndex++}`;
                pendingRequestsById.set(requestId, {
                    actionType: 'creation',
                    requestKey: child.key,
                    request
                });
                requestCards.push(`
                    <div class="request-card" data-request-id="${requestId}">
                        <div class="request-info">
                            <div class="request-empire">⚑ ${escapeHtml(request.name || 'Нове правління')}</div>
                            <div class="request-meta">Гравець: ${escapeHtml(request.ownerName || 'Гравець')}</div>
                            <div class="request-type">Створення ${escapeHtml(organizationLabels[request.organizationLevel] || 'правління')}</div>
                            ${request.description ? `<div class="request-meta">${escapeHtml(request.description)}</div>` : ''}
                        </div>
                        <div class="request-actions">
                            <button class="btn-approve" type="button" data-action="approve" data-request-id="${requestId}">✓ Підтвердити</button>
                            <button class="btn-reject" type="button" data-action="reject" data-request-id="${requestId}">✗ Відхилити</button>
                        </div>
                    </div>
                `);
            });

            if (requestCards.length === 0) {
                list.innerHTML = '<div class="empty">Немає заявок на розгляді.</div>';
                hideRequestMinimap();
                return;
            }

            list.innerHTML = requestCards.join('');
        }

        async function approveCreationRequest({ requestKey, request }) {
            const ownerUuid = requestKey;
            const validLevels = ['empire', 'city', 'village', 'country'];
            if (!String(request.name || '').trim() || !validLevels.includes(request.organizationLevel)) {
                showToast('Заявка має некоректну назву або рівень організації.', '#ed7777');
                return false;
            }
            try {
                const empiresSnapshot = await get(ref(db, 'mvdef/empires'));
                let alreadyHasEmpire = false;
                empiresSnapshot.forEach(child => {
                    if (child.val()?.ownerUuid === ownerUuid) alreadyHasEmpire = true;
                });
                if (alreadyHasEmpire) {
                    showToast('У цього гравця вже є правління. Відхиліть застарілу заявку.', '#ed7777');
                    return false;
                }

                const empireKey = push(ref(db, 'mvdef/empires')).key;
                if (!empireKey) throw new Error('Не вдалося створити ID правління.');
                const now = Date.now();
                await update(ref(db), {
                    [`mvdef/empires/${empireKey}`]: {
                        name: String(request.name || '').trim(),
                        description: String(request.description || '').trim(),
                        organizationLevel: request.organizationLevel || 'empire',
                        government: request.government || 'monarchy',
                        color: /^#[0-9a-f]{6}$/i.test(request.color || '') ? request.color.toLowerCase() : '#81c878',
                        avatar: typeof request.avatar === 'string' && request.avatar.startsWith('data:image/jpeg;base64,')
                            ? request.avatar
                            : null,
                        ownerUuid,
                        ownerName: request.ownerName || 'Гравець',
                        createdAt: now,
                        updatedAt: now
                    },
                    [`mvdef/empireRequests/${requestKey}`]: null,
                    [`mvdef/notifications/${ownerUuid}/${now}`]: {
                        message: '✅ Заявку на створення правління підтверджено. Тепер можна вибирати території на карті.',
                        read: false,
                        createdAt: now
                    }
                });
            } catch (error) {
                console.error('Не вдалося підтвердити створення правління:', error);
                showToast(`Помилка підтвердження: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
                return false;
            }

            showToast('✓ Створення правління підтверджено!');
            try {
                await loadPending();
            } catch (error) {
                console.error('Не вдалося оновити список заявок:', error);
                showToast(`Заявку оброблено, але список не оновився: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
            }
            return true;
        }

        async function rejectCreationRequest({ requestKey, request }) {
            const ownerUuid = requestKey;
            const now = Date.now();
            try {
                await update(ref(db), {
                    [`mvdef/empireRequests/${requestKey}`]: null,
                    [`mvdef/notifications/${ownerUuid}/${now}`]: {
                        message: '❌ Заявку на створення правління відхилено модератором.',
                        read: false,
                        createdAt: now
                    }
                });
            } catch (error) {
                console.error('Не вдалося відхилити створення правління:', error);
                showToast(`Помилка відхилення: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
                return false;
            }

            showToast('Заявку на створення правління відхилено.', '#ed7777');
            try {
                await loadPending();
            } catch (error) {
                console.error('Не вдалося оновити список заявок:', error);
                showToast(`Заявку оброблено, але список не оновився: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
            }
            return true;
        }

        function updateRequestMinimap() {
            if (!shiftPressed || !hoveredRequestCard) {
                hideRequestMinimap();
                return;
            }

            const requestId = hoveredRequestCard.dataset.requestId;
            const request = pendingRequestsById.get(requestId);
            if (!request || request.actionType !== 'territory' || !Array.isArray(request.keys)) {
                hideRequestMinimap();
                return;
            }

            drawRequestMinimap(request);
            requestMinimap.style.display = 'block';
            requestMinimap.setAttribute('aria-hidden', 'false');
            positionRequestMinimap(pointerX, pointerY);
        }

        function drawRequestMinimap(request) {
            const coordinates = request.keys.map(key => {
                const match = /^world_(-?\d+)_(-?\d+)$/.exec(key);
                return match ? { x: Number(match[1]), z: Number(match[2]) } : null;
            }).filter(Boolean);
            if (!coordinates.length) {
                requestMinimapTitle.textContent = `${request.empireName} — координати недоступні`;
                requestMinimapCanvas.width = 0;
                requestMinimapCanvas.height = 0;
                return;
            }

            const minX = Math.min(...coordinates.map(point => point.x)) - 1;
            const maxX = Math.max(...coordinates.map(point => point.x)) + 1;
            const minZ = Math.min(...coordinates.map(point => point.z)) - 1;
            const maxZ = Math.max(...coordinates.map(point => point.z)) + 1;
            const columns = maxX - minX + 1;
            const rows = maxZ - minZ + 1;
            const cellSize = Math.max(1, Math.min(22, 300 / columns, 220 / rows));

            requestMinimapTitle.textContent = `${request.empireName} · ${coordinates.length} чанків`;
            requestMinimapCanvas.width = Math.ceil(columns * cellSize);
            requestMinimapCanvas.height = Math.ceil(rows * cellSize);
            const context = requestMinimapCanvas.getContext('2d');
            context.fillStyle = '#101713';
            context.fillRect(0, 0, requestMinimapCanvas.width, requestMinimapCanvas.height);
            context.strokeStyle = 'rgba(220, 233, 223, 0.16)';
            context.lineWidth = 1;

            for (let x = minX; x <= maxX; x++) {
                for (let z = minZ; z <= maxZ; z++) {
                    const key = `world_${x}_${z}`;
                    const chunk = minimapChunks[key];
                    const requested = request.keys.includes(key);
                    let color = minimapBiomes[key] || '#24312a';
                    if (chunk?.status === 'active') {
                        color = minimapEmpires[chunk.empireId] || '#627069';
                    } else if (chunk?.status === 'pending') {
                        color = '#d1b65e';
                    }

                    const cellX = (x - minX) * cellSize;
                    const cellY = (z - minZ) * cellSize;
                    context.fillStyle = color;
                    context.fillRect(cellX, cellY, cellSize, cellSize);
                    context.strokeRect(cellX + 0.5, cellY + 0.5, cellSize - 1, cellSize - 1);
                    if (requested) {
                        context.strokeStyle = '#ffffff';
                        context.lineWidth = 2;
                        context.strokeRect(cellX + 1, cellY + 1, cellSize - 2, cellSize - 2);
                        context.strokeStyle = 'rgba(220, 233, 223, 0.16)';
                        context.lineWidth = 1;
                    }
                }
            }
        }

        function positionRequestMinimap(x, y) {
            const margin = 12;
            const previewRect = requestMinimap.getBoundingClientRect();
            const left = x + previewRect.width + margin <= window.innerWidth
                ? x + margin
                : Math.max(margin, x - previewRect.width - margin);
            const top = Math.min(
                Math.max(margin, y - previewRect.height / 2),
                window.innerHeight - previewRect.height - margin
            );
            requestMinimap.style.left = `${left}px`;
            requestMinimap.style.top = `${top}px`;
        }

        function hideRequestMinimap() {
            requestMinimap.style.display = 'none';
            requestMinimap.setAttribute('aria-hidden', 'true');
        }

        async function approveRequest({ empireId, ownerUuid, keys, requestType }) {
            const updates = {};
            keys.forEach(k => {
                updates[`mvdef/chunks/${k}/status`] = requestType === 'surrender' ? 'neutral' : 'active';
                updates[`mvdef/chunks/${k}/requestType`] = null;
                if (requestType === 'surrender') {
                    updates[`mvdef/chunks/${k}/empireId`] = null;
                }
            });
            updates[`mvdef/notifications/${ownerUuid}/${Date.now()}`] = {
                message: requestType === 'surrender'
                    ? `✅ Відмову від території підтверджено. Звільнено ${keys.length} чанків.`
                    : `✅ Заявку підтверджено! Імперія розширена на ${keys.length} чанків.`,
                read: false,
                createdAt: Date.now()
            };
            try {
                await update(ref(db), updates);
            } catch (error) {
                console.error('Не вдалося підтвердити заявку:', error);
                showToast(`Помилка підтвердження: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
                return false;
            }
            showToast(requestType === 'surrender' ? '✓ Території звільнено!' : '✓ Підтверджено!');
            try {
                await loadPending();
            } catch (error) {
                console.error('Не вдалося оновити список заявок:', error);
                showToast(`Заявку оброблено, але список не оновився: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
            }
            return true;
        }

        async function rejectRequest({ empireId, ownerUuid, keys, requestType }) {
            const updates = {};
            keys.forEach(k => {
                updates[`mvdef/chunks/${k}/status`] = requestType === 'surrender' ? 'active' : 'neutral';
                updates[`mvdef/chunks/${k}/requestType`] = null;
                if (requestType !== 'surrender') {
                    updates[`mvdef/chunks/${k}/empireId`] = null;
                }
            });
            updates[`mvdef/notifications/${ownerUuid}/${Date.now()}`] = {
                message: requestType === 'surrender'
                    ? `❌ Відмову від території не підтверджено. Чанки залишилися у вашій імперії.`
                    : `❌ Заявку відхилено. Зверніться до адміністратора.`,
                read: false,
                createdAt: Date.now()
            };
            try {
                await update(ref(db), updates);
            } catch (error) {
                console.error('Не вдалося відхилити заявку:', error);
                showToast(`Помилка відхилення: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
                return false;
            }
            showToast(requestType === 'surrender' ? 'Відхилено — території залишилися у власника.' : 'Відхилено.', '#ed7777');
            try {
                await loadPending();
            } catch (error) {
                console.error('Не вдалося оновити список заявок:', error);
                showToast(`Заявку оброблено, але список не оновився: ${error instanceof Error ? error.message : 'невідома помилка'}`, '#ed7777');
            }
            return true;
        }
    </script>
</body>
