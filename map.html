<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVDeF — Карта</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <div class="navbar">
        <h1>⚑ MVDeF</h1>
        <nav>
            <a href="cabinet.html">Кабінет</a>
            <a href="map.html">Карта</a>
            <a href="#" id="logoutBtn">Вийти</a>
        </nav>
    </div>

    <div class="map-toolbar">
        <span id="coordsInfo">Чанк: —</span>
        <span id="selectedInfo">Вибрано: 0 чанків</span>
        <button class="btn btn-primary" id="submitBtn" style="display:none">Подати заявку</button>
    </div>

    <div id="mapContainer">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div id="tooltip" class="tooltip"></div>

    <script type="module">
        import { db } from './js/firebase.js';
        import { ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const uuid = sessionStorage.getItem('uuid');
        if (!uuid) { window.location.href = 'login.html'; }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');

        // Розміри світу в чанках (-312 до 312)
        const WORLD_MIN = -312;
        const WORLD_MAX = 312;
        const WORLD_SIZE = WORLD_MAX - WORLD_MIN; // 624 чанки

        let CHUNK_SIZE = 2; // пікселів на чанк (рівень 1)
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let zoomLevel = 1; // 1 = чанки, 2 = блоки

        const chunks = {};     // key -> { empireId, status }
        const empires = {};    // empireId -> { name, color }
        const biomes = {};     // key -> color
        const selected = new Set();
        let myEmpireId = null;

        // Кольори біомів
        const BIOME_COLORS = {
            'forest': '#2d5a1b',
            'plains': '#7dab3c',
            'desert': '#d4b96a',
            'ocean': '#1a4d8a',
            'mountains': '#8a8a8a',
            'snow': '#e8e8f0',
            'swamp': '#6b7a3d',
            'savanna': '#c8a84b',
            'jungle': '#1a7a1a',
            'default': '#3a5a2a'
        };

        // Кольори для імперій (автоматично)
        const EMPIRE_COLORS = [
            '#e94560', '#4560e9', '#45e960', '#e96045',
            '#9045e9', '#e9c045', '#45e9c0', '#e945c0'
        ];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 100;

        // Центруємо карту
        offsetX = canvas.width / 2 - (WORLD_SIZE * CHUNK_SIZE) / 2;
        offsetY = canvas.height / 2 - (WORLD_SIZE * CHUNK_SIZE) / 2;

        // Завантажуємо дані
        async function loadData() {
            // Моя імперія
            const empiresSnap = await get(ref(db, 'mvdef/empires'));
            let colorIndex = 0;
            empiresSnap.forEach(child => {
                const e = child.val();
                empires[child.key] = {
                    name: e.name,
                    color: EMPIRE_COLORS[colorIndex % EMPIRE_COLORS.length]
                };
                colorIndex++;
                if (e.ownerUuid === uuid) myEmpireId = child.key;
            });

            // Біоми
            const biomesSnap = await get(ref(db, 'mvdef/map'));
            biomesSnap.forEach(child => {
                biomes[child.key] = child.val().color || BIOME_COLORS['default'];
            });

            // Чанки в реальному часі
            onValue(ref(db, 'mvdef/chunks'), snapshot => {
                Object.keys(chunks).forEach(k => delete chunks[k]);
                snapshot.forEach(child => {
                    chunks[child.key] = child.val();
                });
                draw();
            });
        }

        function chunkToCanvas(cx, cz) {
            return {
                x: offsetX + (cx - WORLD_MIN) * CHUNK_SIZE,
                y: offsetY + (cz - WORLD_MIN) * CHUNK_SIZE
            };
        }

        function canvasToChunk(px, py) {
            return {
                cx: Math.floor((px - offsetX) / CHUNK_SIZE) + WORLD_MIN,
                cz: Math.floor((py - offsetY) / CHUNK_SIZE) + WORLD_MIN
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Фон
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let cx = WORLD_MIN; cx < WORLD_MAX; cx++) {
                for (let cz = WORLD_MIN; cz < WORLD_MAX; cz++) {
                    const pos = chunkToCanvas(cx, cz);

                    // Пропускаємо якщо поза екраном
                    if (pos.x + CHUNK_SIZE < 0 || pos.x > canvas.width) continue;
                    if (pos.y + CHUNK_SIZE < 0 || pos.y > canvas.height) continue;

                    const key = `world_${cx}_${cz}`;
                    const chunk = chunks[key];
                    const biomeColor = biomes[key] || BIOME_COLORS['default'];
                    const isSelected = selected.has(key);

                    if (chunk) {
                        if (chunk.status === 'active') {
                            const empire = empires[chunk.empireId];
                            ctx.fillStyle = empire ? empire.color : '#555';
                        } else if (chunk.status === 'pending') {
                            ctx.fillStyle = '#c8a800';
                        } else {
                            ctx.fillStyle = biomeColor;
                        }
                    } else {
                        ctx.fillStyle = isSelected ? '#ffffff' : biomeColor;
                    }

                    ctx.fillRect(pos.x, pos.y, CHUNK_SIZE - 0.5, CHUNK_SIZE - 0.5);

                    // Рамка для вибраних
                    if (isSelected) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(pos.x, pos.y, CHUNK_SIZE - 0.5, CHUNK_SIZE - 0.5);
                    }
                }
            }
        }

        // Zoom
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -1 : 1;
            const newSize = Math.max(1, Math.min(16, CHUNK_SIZE + delta));

            // Зум відносно курсора
            const mouseX = e.clientX;
            const mouseY = e.clientY - 100;
            offsetX = mouseX - (mouseX - offsetX) * (newSize / CHUNK_SIZE);
            offsetY = mouseY - (mouseY - offsetY) * (newSize / CHUNK_SIZE);
            CHUNK_SIZE = newSize;
            draw();
        });

        // Перетягування
        canvas.addEventListener('mousedown', e => {
            isDragging = false;
            dragStart = { x: e.clientX - offsetX, y: e.clientY - offsetY };
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('mousemove', e => {
            const newOffX = e.clientX - dragStart.x;
            const newOffY = e.clientY - dragStart.y;

            if (Math.abs(newOffX - offsetX) > 3 || Math.abs(newOffY - offsetY) > 3) {
                isDragging = true;
                offsetX = newOffX;
                offsetY = newOffY;
                draw();
            }

            // Tooltip
            const { cx, cz } = canvasToChunk(e.clientX, e.clientY - 100);
            document.getElementById('coordsInfo').textContent = `Чанк: ${cx}, ${cz}`;

            const key = `world_${cx}_${cz}`;
            const chunk = chunks[key];
            if (chunk && chunk.status === 'active') {
                const empire = empires[chunk.empireId];
                tooltip.textContent = empire ? `⚑ ${empire.name}` : '';
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 12) + 'px';
                tooltip.style.top = (e.clientY + 12) + 'px';
            } else {
                tooltip.style.display = 'none';
            }
        });

        canvas.addEventListener('mouseup', e => {
            canvas.style.cursor = 'crosshair';
            if (isDragging) return;

            // Клік — вибір чанка
            const { cx, cz } = canvasToChunk(e.clientX, e.clientY - 100);
            const key = `world_${cx}_${cz}`;
            const chunk = chunks[key];

            // Можна вибирати тільки вільні чанки
            if (!chunk || chunk.status === 'neutral') {
                if (selected.has(key)) {
                    selected.delete(key);
                } else {
                    selected.add(key);
                }
                document.getElementById('selectedInfo').textContent = `Вибрано: ${selected.size} чанків`;
                document.getElementById('submitBtn').style.display = selected.size > 0 ? 'inline-block' : 'none';
                draw();
            }
        });

        // Подати заявку
        document.getElementById('submitBtn').addEventListener('click', async () => {
            if (!myEmpireId) {
                alert('У вас немає імперії. Зверніться до адміністратора.');
                return;
            }
            if (selected.size === 0) return;

            const updates = {};
            selected.forEach(key => {
                updates[`mvdef/chunks/${key}`] = {
                    empireId: myEmpireId,
                    status: 'pending'
                };
            });

            await set(ref(db), updates);
            selected.clear();
            document.getElementById('selectedInfo').textContent = 'Вибрано: 0 чанків';
            document.getElementById('submitBtn').style.display = 'none';
            alert('Заявку подано! Очікуйте підтвердження модератора.');
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 100;
            draw();
        });

        loadData();
    </script>
</body>
</html>
